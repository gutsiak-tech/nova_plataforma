# Exemplo Nginx — CAGED Dashboard (referência; ajuste domínio, paths e TLS)
#
# Pré-requisitos:
#   - dashboard/dist gerado com `npm run build`
#   - FastAPI/uvicorn em 127.0.0.1:8000
#   - APP_ENV=production na API
#
# CSP não incluída aqui — validar Leaflet/Vite antes de habilitar no proxy.

upstream caged_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name seudominio.com www.seudominio.com;

    # Descomente após obter certificado (Let's Encrypt / ACME):
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/seudominio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/seudominio.com/privkey.pem;
    # if ($scheme != "https") { return 301 https://$host$request_uri; }

    root /var/www/caged-dashboard/dist;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Security headers (API também envia estes; reforço no edge)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Assets versionados pelo Vite — cache longo
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # GeoJSON estático (mapas)
    location /geo/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # API FastAPI
    location /api/ {
        proxy_pass http://caged_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health/ready opcionais (úteis para monitoramento interno)
    location = /health {
        proxy_pass http://caged_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA — fallback para index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
