# Exemplo Nginx — CAGED Dashboard (referência; ajuste domínio, paths e TLS)
#
# Pré-requisitos:
#   - dashboard/dist gerado com `npm run build`
#   - FastAPI/uvicorn em 127.0.0.1:8000 (APP_ENV=production)
#   - PostgreSQL/PostGIS em rede PRIVADA — NUNCA exponha a porta 5432 na internet
#
# CSP não incluída aqui — validar Leaflet/Vite antes de habilitar no proxy.

limit_req_zone $binary_remote_addr zone=caged_api_limit:10m rate=30r/s;

upstream caged_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Redirecionar HTTP → HTTPS (obrigatório em produção pública)
server {
    listen 80;
    server_name seudominio.com www.seudominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name seudominio.com www.seudominio.com;

    # Certificado TLS (Let's Encrypt / ACME ou institucional)
    ssl_certificate     /etc/letsencrypt/live/seudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seudominio.com/privkey.pem;

    root /var/www/caged-dashboard/dist;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Security headers (API também envia estes; reforço no edge)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Assets versionados pelo Vite — cache longo
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # GeoJSON estático (mapas)
    location /geo/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # API FastAPI — rate limit adicional no edge (complementa middleware da API)
    location /api/ {
        limit_req zone=caged_api_limit burst=60 nodelay;
        proxy_pass http://caged_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health/ready opcionais (monitoramento interno; não expor publicamente se possível)
    location = /health {
        proxy_pass http://caged_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA — fallback para index.html (sem cache longo)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# Postgres: bind apenas em rede interna/VPC ou localhost do host Docker.
# Nunca mapear 5432:5432 para 0.0.0.0 em produção pública.
